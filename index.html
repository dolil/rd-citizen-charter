<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাগরিক সনদ বোর্ড — ডাউনলোড</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  :root { --green:#1a7a38; --ink:#1a1a1a; --muted:#666; --line:#e2e2e2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Tiro Bangla',serif; color:var(--ink); background:#fff;
         line-height:1.6; font-size:17px; }
  main { max-width:880px; margin:0 auto; padding:32px 16px 60px; }
  a { color:var(--green); }

  h1 { font-size:28px; font-weight:400; color:var(--green); }
  .meta { color:var(--muted); font-size:15px; margin:4px 0 18px; }
  .note { font-size:15.5px; margin-bottom:22px; }

  .find input { width:100%; font:inherit; font-size:16px; padding:10px 12px;
                border:1px solid #bbb; border-radius:4px; margin-bottom:26px; }

  h2 { font-size:21px; font-weight:400; color:var(--green); margin:28px 0 6px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:12px 0; border-top:1px solid var(--line); vertical-align:middle; }
  td.dl { width:130px; text-align:right; padding-left:12px; white-space:nowrap; }
  td.dl a { display:inline-block; text-decoration:none; color:#fff; background:var(--green);
            border-radius:4px; padding:6px 14px; }
  td.dl a.img { background:#fff; color:var(--green); border:1px solid var(--green); padding:5px 13px; }
  td.dl small { display:block; color:var(--muted); font-size:13px; margin-top:3px; }
  .sub { color:var(--muted); font-size:14px; }

  .empty { color:var(--muted); padding:30px 0; }
  .empty code { font-family:ui-monospace,Consolas,monospace; font-size:14px; color:var(--ink); }
  [hidden] { display:none !important; }

  @media (max-width: 560px) {
    td { display:block; border-top:0; padding:4px 0; }
    tr { display:block; border-top:1px solid var(--line); padding:10px 0; }
    td.dl { display:inline-block; width:auto; text-align:left; padding:6px 16px 0 0; }
  }
</style>
</head>
<body>
<main>
  <h1>নাগরিক সনদ ও সেবা তথ্য বোর্ড</h1>
  <div class="meta" id="meta">সাব-রেজিস্ট্রি অফিসসমূহের বোর্ড — ডাউনলোড</div>

  <p class="note">
    প্রতিটি অফিসের জন্য দুটি ZIP ফাইল — প্রতিটিতে নাগরিক সনদসহ সব বোর্ড।
    <b>ছাপানোর জন্য PDF ব্যবহার করুন</b>; যে প্রেস ফটোশপ বা ইলাস্ট্রেটরে কাজ করে,
    তাদের জন্য ছবি (১৫০ dpi JPG, স্বচ্ছ স্টিকার ও প্লেট PNG)।
  </p>

  <div class="find" id="find" hidden>
    <input type="search" id="q" autocomplete="off"
           placeholder="অফিস, উপজেলা বা জেলার নাম লিখে খুঁজুন" aria-label="অফিস খুঁজুন">
  </div>

  <div id="list"></div>
</main>

<script>
const BN = '০১২৩৪৫৬৭৮৯';
const bn = s => String(s).replace(/[0-9]/g, d => BN[d]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন',
                'জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function bnDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return esc(iso);
  return bn(+m[3]) + ' ' + MONTHS[+m[2] - 1] + ', ' + bn(m[1]);
}

function link(f, cls, label) {
  if (!f) return '—';
  return '<a class="' + cls + '" href="' + esc(f.url) + '" download>' + label + '</a>' +
         '<small>' + esc(bn(f.size)) + '</small>';
}

function row(o) {
  const key = [o.office, o.upazila, o.district, o.folder].join(' ').toLowerCase();
  return '<tr data-k="' + esc(key) + '">' +
    '<td>' + esc(o.office) +
      '<div class="sub">' + (o.count ? bn(o.count) + 'টি বোর্ড · ' : '') + esc(o.published) + '</div></td>' +
    '<td class="dl">' + link(o.pdf, 'pdf', 'PDF') + '</td>' +
    '<td class="dl">' + link(o.img, 'img', 'ছবি') + '</td>' +
  '</tr>';
}

function district(d) {
  return '<section><h2>' + esc(d.district) + '</h2><table><tbody>' +
         d.offices.map(row).join('') + '</tbody></table></section>';
}

function empty(html) {
  document.getElementById('list').innerHTML = '<div class="empty">' + html + '</div>';
}

function render(data) {
  const ds = (data && Array.isArray(data.districts)) ? data.districts : [];
  if (!ds.length) {
    return empty('এখনো কোনো বোর্ড প্রকাশিত হয়নি। প্রকাশ করতে চালান: ' +
                 '<code>bash release.sh &lt;office&gt;</code>');
  }
  const n = ds.reduce((a, d) => a + d.offices.length, 0);
  document.getElementById('meta').innerHTML =
    bn(n) + 'টি অফিস · ' + bn(ds.length) + 'টি জেলা' +
    (data.generated ? ' · হালনাগাদ: ' + bnDate(data.generated) : '');
  document.getElementById('list').innerHTML = ds.map(district).join('') +
    '<div class="empty" id="nohit" hidden>কোনো অফিস পাওয়া যায়নি।</div>';
  document.getElementById('find').hidden = false;
  document.getElementById('q').addEventListener('input', search);
}

// hide offices that don't match, then districts left with none
function search() {
  const words = document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let hits = 0;
  document.querySelectorAll('#list section').forEach(sec => {
    let shown = 0;
    sec.querySelectorAll('tr').forEach(tr => {
      const ok = words.every(w => tr.dataset.k.includes(w));
      tr.hidden = !ok;
      if (ok) shown++;
    });
    sec.hidden = !shown;
    hits += shown;
  });
  document.getElementById('nohit').hidden = hits > 0;
}

// browsers refuse fetch() on file:// — say so rather than claim nothing is published
if (location.protocol === 'file:') {
  empty('ফাইল হিসেবে খোলা হয়েছে — ব্রাউজার লোকাল ফাইল থেকে তালিকা পড়তে দেয় না। ' +
        'চালান <code>python -m http.server 8000</code>, তারপর খুলুন <code>http://localhost:8000/</code>।');
} else fetch('releases.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => render(null));
</script>
</body>
</html>
