<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নাগরিক সনদ বোর্ড — ডাউনলোড</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  :root { --green:#1a7a38; --ink:#1a1a1a; --muted:#666; --line:#e3e3e3; --tint:#f4f8f5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Tiro Bangla',serif; color:var(--ink); background:#fff;
         line-height:1.5; font-size:16px; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 48px; }

  h1 { font-size:24px; font-weight:400; color:var(--green); }
  .meta { color:var(--muted); font-size:14px; margin:2px 0 10px; }
  .note { font-size:14.5px; margin-bottom:14px; }

  .find input { width:100%; font:inherit; font-size:16px; padding:8px 12px;
                border:1px solid #bbb; border-radius:4px; margin-bottom:14px; }
  .one { background:var(--tint); border:1px solid var(--line); border-radius:4px;
         padding:8px 12px; margin-bottom:14px; font-size:14.5px; }

  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  thead th { font-weight:400; color:var(--muted); font-size:13.5px; border-bottom:2px solid var(--line); }
  tr.dh th { background:var(--tint); color:var(--green); font-weight:400; font-size:16px; }
  tr.dh small { color:var(--muted); font-size:13px; }
  td.n { color:var(--muted); width:34px; }
  td.o small { display:block; color:var(--muted); font-size:13px; }
  tr.hit td { background:#fffbe6; }
  td.b, th.b { width:1%; white-space:nowrap; text-align:center; }

  .btn { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:14px;
         text-decoration:none; border-radius:4px; padding:5px 10px; cursor:pointer;
         border:1px solid var(--green); background:#fff; color:var(--green); white-space:nowrap; }
  .btn.pdf { background:var(--green); color:#fff; }
  .btn span { font-size:12.5px; opacity:.8; }
  .btn:hover { filter:brightness(.93); }
  .btn.ic { padding:5px 8px; }
  .btn svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2;
             stroke-linecap:round; stroke-linejoin:round; }
  .acts { display:inline-flex; gap:6px; }

  .empty { color:var(--muted); padding:24px 0; }
  .empty code { font-family:ui-monospace,Consolas,monospace; font-size:14px; color:var(--ink); }
  [hidden] { display:none !important; }

  /* phones: each office becomes a compact card */
  @media (max-width: 640px) {
    main { padding-top:16px; }
    h1 { font-size:21px; }
    thead, td.n { display:none; }
    table, tbody, tr, td, th { display:block; width:100%; }
    tr.dh th { padding:8px 10px; }
    /* office name on top with copy/share at its right, the two downloads below */
    tr.row { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; position:relative;
             padding:10px 2px; border-bottom:1px solid var(--line); }
    tr.row td { border:0; padding:0; }
    td.o { grid-column:1 / -1; padding-right:84px !important; }
    td.a { position:absolute; top:10px; right:2px; width:auto; }
    td.b { width:auto; text-align:left; }
    td.b .btn:not(.ic) { width:100%; justify-content:center; padding:6px 4px; font-size:14px; }
  }
</style>
</head>
<body>
<main>
  <h1>নাগরিক সনদ ও সেবা তথ্য বোর্ড</h1>
  <div class="meta" id="meta">সাব-রেজিস্ট্রি অফিসসমূহের বোর্ড — ডাউনলোড</div>

  <p class="note">
    প্রতিটি ZIP-এ নাগরিক সনদসহ সব বোর্ড। <b>ছাপানোর জন্য PDF ব্যবহার করুন</b>;
    ফটোশপ বা ইলাস্ট্রেটরে কাজ করা প্রেসের জন্য JPEG (১৫০ dpi; স্বচ্ছ স্টিকার ও প্লেট PNG)।
  </p>

  <div class="find" id="find" hidden>
    <input type="search" id="q" autocomplete="off"
           placeholder="অফিস, উপজেলা বা জেলার নাম লিখে খুঁজুন" aria-label="অফিস খুঁজুন">
  </div>
  <div class="one" id="one" hidden>একটি অফিস দেখানো হচ্ছে — <a href="#" id="all">সব অফিস দেখুন</a></div>

  <div id="list"></div>
</main>

<script>
const BN = '০১২৩৪৫৬৭৮৯';
const bn = s => String(s).replace(/[0-9]/g, d => BN[d]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);

const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন',
                'জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function bnDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return esc(iso);
  return bn(+m[3]) + ' ' + MONTHS[+m[2] - 1] + ', ' + bn(m[1]);
}

const ICON = {
  copy:  '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  share: '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  done:  '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
};
const CAN_SHARE = !!navigator.share;
const BASE = location.origin + location.pathname;
const OFFICES = {};

function dl(f, cls, label) {
  if (!f) return '—';
  return '<a class="btn ' + cls + '" href="' + esc(f.url) + '" download>' + label +
         ' <span>' + esc(bn(f.size)) + '</span></a>';
}

function row(o, i) {
  OFFICES[o.folder] = o;
  const key = [o.office, o.upazila, o.district, o.folder].join(' ').toLowerCase();
  return '<tr class="row" id="o-' + esc(o.folder) + '" data-k="' + esc(key) + '">' +
    '<td class="n">' + bn(i + 1) + '</td>' +
    '<td class="o">' + esc(o.office) +
      '<small>' + (o.count ? bn(o.count) + 'টি বোর্ড · ' : '') + esc(o.published) + '</small></td>' +
    '<td class="b">' + dl(o.pdf, 'pdf', 'PDF Download') + '</td>' +
    '<td class="b">' + dl(o.img, 'jpg', 'JPEG Download') + '</td>' +
    '<td class="b a"><span class="acts">' +
      '<button class="btn ic" data-copy="' + esc(o.folder) + '" title="লিংক কপি করুন" aria-label="লিংক কপি করুন">' + ICON.copy + '</button>' +
      (CAN_SHARE ? '<button class="btn ic" data-share="' + esc(o.folder) + '" title="শেয়ার করুন" aria-label="শেয়ার করুন">' + ICON.share + '</button>' : '') +
    '</span></td>' +
  '</tr>';
}

function district(d) {
  return '<tbody><tr class="dh"><th colspan="5">' + esc(d.district) +
         ' <small>· ' + bn(d.offices.length) + 'টি অফিস</small></th></tr>' +
         d.offices.map(row).join('') + '</tbody>';
}

function empty(html) {
  document.getElementById('list').innerHTML = '<div class="empty">' + html + '</div>';
}

// ---------------------------------------------------------------- links
const linkOf = folder => BASE + '#' + folder;

// the old select-and-copy route, for browsers that refuse the clipboard API
// (some in-app browsers do) — returns whether it worked
function copyOld(t) {
  const a = document.createElement('textarea');
  a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {} finally { a.remove(); }
  return ok;
}

function copyText(t) {
  const api = navigator.clipboard && window.isSecureContext
    ? navigator.clipboard.writeText(t).then(() => true, () => copyOld(t))
    : Promise.resolve(copyOld(t));
  // nothing worked: show the link so it can be copied by hand
  return api.then(ok => { if (!ok) window.prompt('লিংকটি কপি করুন:', t); return ok; });
}

function flash(btn) {
  const was = btn.innerHTML;
  btn.innerHTML = ICON.done + ' <span>কপি হয়েছে</span>';
  setTimeout(() => { btn.innerHTML = was; }, 1600);
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { copyText(linkOf(c.dataset.copy)).then(ok => { if (ok) flash(c); }); return; }
  const s = e.target.closest('[data-share]');
  if (s) {
    const o = OFFICES[s.dataset.share];
    navigator.share({ title: o.office, text: o.office + ' — নাগরিক সনদ ও সেবা তথ্য বোর্ড',
                      url: linkOf(o.folder) }).catch(() => {});
  }
});

// ---------------------------------------------------------------- filter
function apply() {
  const one = location.hash.slice(1);
  const only = one && OFFICES[one] ? one : '';
  const words = only ? [] :
    document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let hits = 0;
  document.querySelectorAll('#list tbody').forEach(tb => {
    let shown = 0;
    tb.querySelectorAll('tr.row').forEach(tr => {
      const ok = only ? tr.id === 'o-' + only : words.every(w => tr.dataset.k.includes(w));
      tr.hidden = !ok;
      tr.classList.toggle('hit', !!only && ok);
      if (ok) shown++;
    });
    tb.hidden = !shown;
    hits += shown;
  });
  document.getElementById('one').hidden = !only;
  document.getElementById('find').hidden = !!only;
  document.getElementById('nohit').hidden = hits > 0;
}

document.getElementById('all').addEventListener('click', e => {
  e.preventDefault();
  history.replaceState(null, '', location.pathname);
  apply();
});
window.addEventListener('hashchange', apply);

function render(data) {
  const ds = (data && Array.isArray(data.districts)) ? data.districts : [];
  if (!ds.length) {
    return empty('এখনো কোনো বোর্ড প্রকাশিত হয়নি। প্রকাশ করতে চালান: ' +
                 '<code>bash release.sh &lt;office&gt;</code>');
  }
  const n = ds.reduce((a, d) => a + d.offices.length, 0);
  document.getElementById('meta').innerHTML =
    bn(n) + 'টি অফিস · ' + bn(ds.length) + 'টি জেলা' +
    (data.generated ? ' · হালনাগাদ: ' + bnDate(data.generated) : '');
  document.getElementById('list').innerHTML =
    '<table><thead><tr><th>#</th><th>অফিস</th><th class="b">PDF</th><th class="b">JPEG</th>' +
    '<th class="b">লিংক</th></tr></thead>' + ds.map(district).join('') + '</table>' +
    '<div class="empty" id="nohit" hidden>কোনো অফিস পাওয়া যায়নি।</div>';
  document.getElementById('q').addEventListener('input', apply);
  apply();
}

// browsers refuse fetch() on file:// — say so rather than claim nothing is published
if (location.protocol === 'file:') {
  empty('ফাইল হিসেবে খোলা হয়েছে — ব্রাউজার লোকাল ফাইল থেকে তালিকা পড়তে দেয় না। ' +
        'চালান <code>python -m http.server 8000</code>, তারপর খুলুন <code>http://localhost:8000/</code>।');
} else fetch('releases.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => render(null));
</script>
</body>
</html>
