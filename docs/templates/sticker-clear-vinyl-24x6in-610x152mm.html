<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্টিকার · Clear Vinyl · 24 × 6 in (610 × 152 mm) · কাচের দরজা ও টেবিল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     ONE STICKER — CLEAR VINYL, RED + GREEN
       one size : 24 × 6 in — glass door and helpdesk table alike
       (door leaf 2.5 ft = 30 in, so 3 in clear each side)
     CLEAR film. Only the red border and the green lettering are
     printed — the glass shows through everywhere else, but the ink
     is opaque, so the band still marks the door at eye level.
     Paste TWO bands per door leaf: centres about 1500 mm and
     950 mm above the floor (standing eye, and seated/child eye).
     ========================================================= */
  :root {
    --green:      #1a5e2a;   /* darker banner green — reads better on clear film */
    --green-deep: #1a5e2a;   /* darker tone from the banner set */
    --red:        #c8102e;
    --gold:       #e8c76a;
    --band-w:     24in;      /* fits a 2.5 ft (30 in) door leaf with room each side */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: 'Tiro Bangla', serif; background: #d8dcd9; padding: 26px 20px 60px; }

  .stage  { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .cap    { font-family: 'Hind Siliguri', sans-serif; font-size: 13px; color: #4d5b52; }

  .glass {
    padding: 16px; border-radius: 6px; display: inline-block;
    background:
      linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      repeating-conic-gradient(#e9ece9 0% 25%, #dfe3e0 0% 50%) 0 0 / 22px 22px;
    box-shadow: 0 4px 16px rgba(0,0,0,.14);
  }

  #band {
    width: var(--band-w); height: 6in;
    display: flex; align-items: center; justify-content: center;
    gap: 0.55in;
    padding: 0.3in 0.7in;
    background: transparent;              /* clear vinyl */
    border: 0.16in solid var(--red);      /* single rule all round */
    overflow: hidden;
  }

  #band .logo   { width: 3.7in; height: 3.7in; flex: 0 0 auto; object-fit: contain; }
  #band .txt    { text-align: left; }
  #band .govt   { font-size: 44pt;  color: var(--red);        line-height: 1.45; }
  #band .office { font-size: 104pt; color: var(--green);      line-height: 1.32; margin: 0.1in 0 0.08in; }
  #band .place  { font-size: 62pt;  color: var(--green-deep); line-height: 1.4; }

  .bar-ui {
    position: fixed; top: 12px; left: 12px; z-index: 99;
    display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #b7b7b7; border-radius: 8px;
    padding: 6px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.18);
    font: 13px/1 system-ui, sans-serif;
  }
  .bar-ui button {
    font: 13px/1 system-ui, sans-serif; padding: 6px 10px;
    border: 1px solid #b7b7b7; background: #f6f6f6;
    border-radius: 5px; cursor: pointer; color: #222;
  }
  .bar-ui button:hover { background: #e9e9e9; }
  .bar-ui .lbl { color: #777; margin-left: 4px; }

  @media print {
    body { background: none; padding: 0; }
    .bar-ui, .cap { display: none !important; }
    .glass { background: none !important; box-shadow: none !important; padding: 0 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="bar-ui">
  <button id="pd">Print 24 × 6 in</button>
  <span class="lbl">clear vinyl · লাল-সবুজ · কাচের দরজা ও টেবিল — একই স্টিকার</span>
</div>

<div class="stage">
  <div class="cap">স্টিকার · H-0.5 x W-2 ft — কাচের দরজা ও হেল্পডেস্ক টেবিল</div>
  <div class="glass">
    <div id="band">
      <img class="logo" src="bd-govt-logo.png" alt="">
      <div class="txt">
        <div class="govt">গণপ্রজাতন্ত্রী বাংলাদেশ সরকার</div>
        <div class="office">সাব-রেজিস্ট্রারের কার্যালয়</div>
        <div class="place">সিরাজদিখান, মুন্সীগঞ্জ</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var pageStyle = document.createElement('style');
  document.head.appendChild(pageStyle);
  pageStyle.textContent = '@page { size: 24in 6in; margin: 0; }';
  document.getElementById('pd').onclick = function () { window.print(); };
})();
</script>
</body>
</html>
